<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Descarga de viviendas</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header>
    <div class="head-row">
      <h1>Descarga de viviendas</h1>
      <span class="saved" id="saved" role="status">Conectando…</span>
    </div>
    <div class="modes" role="group" aria-label="Qué descarga ver">
      <button data-mode="descarga">Descarga<small data-fecha="descarga"></small></button>
      <button data-mode="cc">CC<small data-fecha="cc"></small></button>
    </div>
    <label class="fecha">Fecha de este grupo <input type="date" id="fecha"></label>
    <div class="load-caption" id="loadCaption"></div>
  </header>

  <div class="mapwrap">
    <div id="map" role="region" aria-label="Mapa del recorrido"></div>
    <div class="placing" id="placing"><span id="placingText"></span><button id="cancelPlacing">Cancelar</button></div>
    <div class="mapbtns">
      <button id="btnFit">Ver todo</button>
      <button id="btnMe">Dónde estoy</button>
    </div>
  </div>

  <div class="panel">
    <nav class="tabs" id="tabs">
      <button data-t="recorrido">Recorrido</button>
      <button data-t="casas">Casas</button>
      <button data-t="ubicaciones">Ubicaciones</button>
      <button data-t="informe">Informe</button>
    </nav>
    <div class="content" id="content"></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="viewer" id="viewer"><img alt=""></div>
<input type="file" id="importFile" accept="application/json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
